agent:
  id: "${WECHAT_AGENT_ID:-wechat-agent-01}"
  display_name: "Windows WeChat Agent 01"
  account_alias: "default"

runtime:
  log_level: "INFO"
  data_dir: "${LOCALAPPDATA}/WeChatArticleAgent"
  shutdown_timeout_seconds: 15

platform:
  url: "${WECHAT_PLATFORM_WS_URL:-ws://127.0.0.1:8080/api/v1/agent/ws}"
  registration_key: "${WECHAT_AGENT_REGISTRATION_KEY:-}"
  token: "${WECHAT_PLATFORM_TOKEN:-}"
  connect_timeout_seconds: 15
  heartbeat_interval_seconds: 5
  reconnect_min_seconds: 1
  reconnect_max_seconds: 30
  ack_timeout_seconds: 15
  max_message_size_mb: 16

cache:
  enabled: true
  cli_path: "${WECHAT_CACHE_CLI_PATH}"
  timeout_seconds: 120
  ui_timeout_seconds: 60
  public_content: true

llm:
  base_url: "${WECHAT_AGENT_LLM_BASE_URL}"
  api_key: "${WECHAT_AGENT_LLM_API_KEY}"
  model: "${WECHAT_AGENT_LLM_MODEL}"
  timeout_seconds: 90
  max_tokens: 30720
  temperature: 0.1
  reasoning_effort: "low"
  stream: true
  json_mode: true
  max_retries: 2
  max_snapshot_chars: 32000

mcp:
  command: "C:\\Users\\27175\\.local\\bin\\windows-mcp.exe"
  args:
    - "serve"
    - "--transport"
    - "stdio"
    - "--tools"
    - "Snapshot,Screenshot,Click,Type,Scroll,Shortcut,Wait,WaitFor,Process,PowerShell,Clipboard,Scrape"
  startup_timeout_seconds: 25
  call_timeout_seconds: 60
  reconnect_attempts: 2
  snapshot:
    use_vision: true
    use_annotation: true
    use_ui_tree: true
  env:
    PYTHONIOENCODING: "utf-8"
    ANONYMIZED_TELEMETRY: "false"
    WINDOWS_MCP_WATCHDOG: "off"
    WINDOWS_MCP_SCREENSHOT_BACKEND: "pillow"
    WINDOWS_MCP_SCREENSHOT_SCALE: "1.0"
    WINDOWS_MCP_MAX_TREE_ELEMENTS: "1200"

wechat:
  executable_path: "D:\\hjh\\微信\\Weixin\\Weixin.exe"
  process_name: "Weixin.exe"
  window_title_contains:
    - "微信"
    - "Weixin"
  auto_launch: true
  launch_timeout_seconds: 30
  search_max_steps: 8
  open_profile_max_steps: 6
  max_scroll_screens: 30
  no_new_screen_limit: 3
  article_click_max_steps: 6
  detail_max_scroll_screens: 8
  send_login_screenshot: true

automation:
  max_steps_per_goal: 8
  action_delay_seconds: 0.8
  verification_enabled: true
  max_recoveries_per_goal: 3
  max_repeated_actions: 3
  stop_on_ambiguous_match: true
