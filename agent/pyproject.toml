[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-article-agent"
version = "0.1.0"
description = "Windows WeChat Official Account article agent driven by Windows-MCP and a vision LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "mcp==1.29.0",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "websockets>=14,<16",
]

[project.scripts]
wechat-agent = "wechat_agent.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
